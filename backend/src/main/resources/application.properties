spring.application.name=kolekta

# Charge un fichier .env placé à la racine du dépôt quand on lance l'API sans Docker
# (avec Docker, ce sont les variables d'environnement du conteneur qui s'appliquent).
spring.config.import=optional:file:../.env[.properties]

# Base de données (le mot de passe n'a volontairement pas de valeur par défaut)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kolekta}
spring.datasource.username=${DB_USER:kolekta}
spring.datasource.password=${DB_PASSWORD}

# Le schéma est géré par Flyway (db/migration) ; Hibernate se contente de le valider
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=public

# JWT (JWT_SECRET est obligatoire : l'application refuse de démarrer sans lui)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

server.port=8080
server.servlet.context-path=/
