# Profil "dev" : en plus des migrations, charge les données de démonstration FICTIVES.
# out-of-order : permet d'ajouter une migration V3, V4... plus tard sur une base de dev
# qui a déjà reçu les données de démo (V900).
spring.flyway.locations=classpath:db/migration,classpath:db/dev-seed
spring.flyway.out-of-order=true
