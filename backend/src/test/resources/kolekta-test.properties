# Propriétés des tests : tout ce dont l'application a besoin pour démarrer, sans rien lire de la machine.
# Chargé par @TestPropertySource (AbstractIntegrationTest). Priorité supérieure aux variables
# d'environnement du système, contrairement à un fichier application-*.properties.
# (Ne PAS nommer ce fichier application.properties : il masquerait celui de src/main.)
# Valeurs factices : aucun vrai secret.

jwt.secret=secret-de-test-uniquement-pas-un-vrai-secret-0123456789
jwt.expiration=3600000
spring.datasource.password=inutilise-le-conteneur-fournit-la-connexion
app.cors.allowed-origins=http://localhost:5173
# spring.datasource.url et .username : fournis par le conteneur Testcontainers (@ServiceConnection)
