name: CI

on:
  pull_request:
  push:
    branches: [main]

# Permissions minimales : la CI lit seulement le code
permissions:
  contents: read

# Un nouveau push sur la même branche annule l'exécution précédente
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Docker est déjà présent sur ubuntu-latest : Testcontainers y lance PostgreSQL 18
      - name: Compiler et lancer les tests
        working-directory: backend
        run: ./mvnw -B verify

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Tests
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build
