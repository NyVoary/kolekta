server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # DNS interne de Docker, résolu à l'exécution : nginx démarre même si le backend
    # n'est pas encore prêt, et retrouve sa nouvelle adresse s'il redémarre.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # L'API est servie par le service "backend" : même origine que le site, donc pas de CORS
    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers générés par Vite : le nom contient un hash, on peut les garder longtemps
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Application monopage : toute autre adresse retombe sur index.html (le routeur Vue décide)
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
